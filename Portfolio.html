  <style>

    body { 
      font-family: Arial, sans-serif; 
      margin: 0;
      padding: 0;
      background: #f5f7fa; /* fond gris clair plus professionnel */
      color: #222;
    }

    header {
      background: #0d6efd; 
      color: #fff;
      padding: 60px 20px;
      text-align: center;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    nav a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s ease;
    }

    nav a:hover {
      color: #084298;
    }

    section {
      padding: 50px;
      max-width: 1000px;
      margin: 120px auto 50px;
      text-align: center;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #0d6efd;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      background-color: #084298;
      transform: scale(1.05);
    }

    footer {
      background: #0d6efd;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 80px;
    }
