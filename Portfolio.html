<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; padding: 0; 
      background: #ffffff; 
      color: #222;
    }
    header {
      background: #0d6efd; 
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #e9ecef;
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }
    nav a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s ease;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 50px;
      max-width: 1000px;
      margin: 100px auto 50px;
      text-align: center;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #0d6efd;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #084298;
    }
    footer {
      background: #0d6efd;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
