  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; padding: 0; 
      background: #ffffff; 
      color: #222;
    }
    header {
      background: #0d6efd; 
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #e9ecef;
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }
    nav a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s ease;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 50px;
      max-width: 1000px;
      margin: 100px auto 50px;
      text-align: center;
    }
    .contact-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: inline-block;
      text-align: left;
    }
    .contact-card a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #0d6efd;
      border-radius: 5px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
      margin-right: 10px;
    }
    .contact-card a:hover {
      background-color: #084298;
    }
    footer {
      background: #0d6efd;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
